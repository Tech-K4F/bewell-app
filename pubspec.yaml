name: bewell
description: Be Well - Personal Wellness App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3
  cupertino_icons: ^1.0.6
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/habits/
    - assets/images/companion/
    - assets/images/
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Light.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400


