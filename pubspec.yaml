name: bewell
description: Be Well - Personal Wellness App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3
  cupertino_icons: ^1.0.6
  video_player: ^2.9.2
  firebase_analytics: ^11.6.0
  cloud_firestore: ^5.4.4
  google_mobile_ads: ^5.1.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/habits/
    - assets/images/companion/
    - assets/images/
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Light.ttf
          weight: 300
        - asset: assets/fonts/CormorantGaramond-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400

# ── Launcher Icons ─────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/companion/companion_base.png"
  # Sfondo crema/panna — stesso colore dello sfondo base dell'app (palette Card)
  # Usato per appiattire la trasparenza sull'icona legacy/iOS
  background_color: "#F5F1EA"
  # Icona adattiva Android (API 26+): foreground + sfondo separati
  adaptive_icon_background: "#F5F1EA"
  adaptive_icon_foreground: "assets/images/companion/companion_base.png"
  # Rimuove il canale alpha per rispettare le linee guida App Store iOS
  remove_alpha_ios: true
  # Web e altri target (opzionale)
  web:
    generate: false
  windows:
    generate: false
